[build-system]
requires = ["poetry", "Cython>=3.0", "setuptools", "wheel", "numpy>=1.17.0"]
build-backend = "poetry.masonry.api"

[tool.poetry]
name = "sra-reader"
version = "0.1.0"
description = "Direct SRA file reader for single-cell experiments — bypass fasterq-dump"
license = "MIT"
authors = [
    "Daniel León-Periñán <daniel.leonperinan@mdc-berlin.de>",
]
maintainers = [
    "Daniel León-Periñán <daniel.leonperinan@mdc-berlin.de>",
]
readme = "README.md"
keywords = ["bioinformatics", "sra", "single-cell", "scRNA-seq", "kmer", "fastq"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Cython",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[tool.poetry.build]
script = "build.py"
generate-setup-file = true

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
numpy = ">=1.17.0"

[tool.poetry.group.dev.dependencies]
Cython = ">=3.0"
pytest = ">=7.0.0"
pytest-cov = ">=4.0.0"
coverage = ">=7.0.0"
tqdm = ">=4.0.0"

[tool.poetry.urls]
"Source" = "https://github.com/rajewsky-lab/sra-reader"

[tool.coverage.run]
plugins = ["Cython.Coverage"]
source = ["sra_reader"]
parallel = true
branch = true
relative_files = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise Import.*",
]

# wheel building (cibuildwheel)
[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-*"
skip = "*-win32 *-manylinux_i686 *-musllinux*"
before-build = "pip install 'cython>=3.0' 'numpy>=1.21'"
environment = {SRA_READER_DEBUG_BUILD = "0"}

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
archs = ["x86_64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
